[[permission]]
identifier = "allow-app-commands"
description = "Allows all custom commands defined in the application"
commands.allow = [
  "greet",
  "quit_application",
  "log_from_frontend",
  "list_monitors",
  "capture_screens",
  "trigger_screenshot",
  "open_image_editor",
  "open_image_editor_data",
  "open_recording_control",
  "open_recording_start_control",
  "close_capture_windows",
  "save_and_copy_screenshot",
  "copy_screenshot_to_clipboard",
  "inspect_saved_file",
  "capture_screen_region",
  "capture_full_screen",

  "capture_work_area",
  "pin_screenshot",
  "save_config",
  "load_config",
  "list_audio_input_devices",
  "test_audio_input_device",
  "list_system_fonts",
  "start_recording",
  "stop_recording",
  "get_recording_status",
  "trigger_scroll_capture",
  "auto_scroll_capture_window",
  "cancel_scroll_capture",
  "get_pinned_image",
  "open_image_in_main_editor",

  "unpin_screenshot"
]
