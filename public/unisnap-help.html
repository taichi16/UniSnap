<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>使用說明</title><style>body{margin:0;padding:30px 36px;background:#f8fafc;color:#172033;font:15px Segoe UI,sans-serif}h1{margin:0 0 24px}section{background:#fff;border:1px solid #d7deea;border-radius:10px;padding:14px 16px;margin:12px 0}h2{font-size:16px;color:#2563eb;margin:0 0 5px}p{margin:0;line-height:1.6}</style></head><body><h1>使用說明</h1><section><h2>截圖</h2><p>選擇矩形截圖、全螢幕或工作區，再拖曳選取範圍。</p></section><section><h2>長截圖</h2><p>框選主要可捲動內容區後開始，完成後可裁切、標註與馬賽克。</p></section><section><h2>螢幕錄影</h2><p>框選區域後選擇 FPS、麥克風與系統聲音，再按開始錄影。</p></section><section><h2>儲存與取消</h2><p>編輯工具列可儲存 PNG/JPG；一般截圖按 Esc，長截圖按取消，錄影按停止。</p></section></body></html>
