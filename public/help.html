<!doctype html><html lang="zh-Hant"><meta charset="UTF-8"><title>使用說明</title><style>body{margin:0;background:#f8fafc;color:#172033;font:14px "Segoe UI",sans-serif}.page{padding:28px 34px}h1{font-size:25px;margin:0 0 24px;color:#172033}ul{list-style:none;padding:0;margin:0;display:grid;gap:13px}li{display:grid;gap:4px;padding:14px 16px;border:1px solid #d7deea;border-radius:10px;background:#fff}b{color:#2563eb;font-size:15px}span{line-height:1.6}</style><main class="page"><h1>使用說明</h1><ul><li><b>截圖</b><span>選擇矩形截圖、全螢幕或工作區，再拖曳選取範圍。</span></li><li><b>長截圖</b><span>框選主要可捲動內容區後開始，完成後可裁切、標註與馬賽克。</span></li><li><b>螢幕錄影</b><span>框選區域後選擇 FPS、麥克風與系統聲音，再按開始錄影。</span></li><li><b>儲存</b><span>在編輯工具列選擇 PNG 或 JPG，再按下載圖示另存。</span></li><li><b>取消</b><span>一般截圖按 Esc；長截圖按取消；錄影按停止並存檔。</span></li></ul></main>
